name: Experiments

# Experiments run on demand only (NFR-5), never on every push.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Master seed
        default: "20261006"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run experiments
        run: python experiments/run.py --seed "${{ inputs.seed }}" --out-dir experiments/ci-output
      - name: Check success columns match the committed results
        if: inputs.seed == '20261006'
        run: python experiments/run.py --compare experiments/results.csv experiments/ci-output/results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments/ci-output/
